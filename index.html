<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>خدمة الكشافة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EA;--cd:#fff;--ln:#E4DEC9;--ink:#1c2a22;--mu:#5A675F;--g:#1F5C3A;--au:#C8963E;--rd:#B3261E}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif}
body{padding-bottom:90px;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
header{background:var(--g);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px}header div{flex:1}header h1{margin:0;font-size:22px}header p{margin:2px 0 0;font-size:13px;color:#E3D9B8}.lo{background:none;border:1px solid #E3D9B8;color:#E3D9B8;border-radius:8px;padding:4px 10px;font:600 12px Cairo}
main{padding:14px 16px}.c{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.f{flex:1;min-width:120px}b{font-size:15px}small{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.b{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--g);font:700 14px Cairo,sans-serif;cursor:pointer;background:#fff;color:var(--g)}
.b.ok{background:var(--g);color:#fff}.b.au{background:var(--au);border-color:var(--au);color:#1c2a22}.b.no{background:var(--rd);border-color:var(--rd);color:#fff}.b.w{width:100%}
.t{display:inline-block;padding:6px 12px;border-radius:12px;border:1px solid var(--mu);font-size:12px;font-weight:700;color:var(--mu);background:#fff}.t[data-a]{cursor:pointer}.t.on{background:var(--au);border-color:var(--au);color:#1c2a22}
input,textarea{width:100%;box-sizing:border-box;min-height:44px;border:1px solid var(--ln);border-radius:10px;padding:8px 12px;margin-bottom:8px;font:15px Cairo,sans-serif;background:#fff;color:var(--ink)}
.sq{height:10px;border-radius:5px;flex:1;background:var(--g)}.sq.n{background:var(--rd)}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;background:#fff;border-top:1px solid var(--ln);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px))}
nav div{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--mu);cursor:pointer}nav i{display:block;width:22px;height:4px;border-radius:2px;margin:0 auto 6px}nav .on{color:var(--g)}nav .on i{background:var(--au)}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#1c2a22;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:9;max-width:90%}.e{text-align:center;color:var(--mu);padding:30px 10px}
</style></head><body><div id="app"><div class="e">جارٍ التحميل…</div></div><nav id="nav"></nav><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ===== حط بيانات مشروعك هنا (من Supabase > Project Settings > API) =====
const SUPABASE_URL='https://nxtgtdmizdgakufmrunj.supabase.co',SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54dGd0ZG1pemRnYWt1Zm1ydW5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4NTc4MzUsImV4cCI6MjExMDQzMzgzNX0.uZI3eXSIK484D7ShmI6P1WCjIPdClQCR88o_d3o0nwk';
// =====================================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const lastFri=(d=new Date())=>add(d,-((d.getDay()+2)%7));
const arD=d=>d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS=[['att','الحضور'],['kids','الأولاد'],['pat','الطلايع'],['vis','الافتقاد'],['ch','الصيحات']];
const S={tab:'att',view:null,form:{},q:'',date:lastFri(),kids:[],patrols:[],chants:[],bt:[],kb:[],att:{},attRows:[],vis:{},people:{}};
let me=null,admin=false,ready=false;
const ym=()=>fmt(new Date()).slice(0,7);
const B=(l,a,k='',x='')=>`<button class="b ${k}" data-a="${a}" ${x}>${l}</button>`;
const T=(l,on,a,x='')=>`<span class="t${on?' on':''}"${a?` data-a="${a}" ${x}`:''}>${esc(l)}</span>`;
const H=(t,s)=>`<header><div><h1>${t}</h1>${s?`<p>${s}</p>`:''}</div>${me?'<button class="lo" data-a="out">خروج</button>':''}</header>${S.dirty&&admin&&ready?`<div class="c r" style="margin:10px 16px 0"><div class="f"><b>اتغيرت بيانات</b><small>نزّل نسخة Excel محدّثة</small></div>${B('تنزيل','xl','au')}</div>`:''}`;
const em=t=>`<div class="e">${t}</div>`;
const kidsA=()=>S.kids.filter(k=>k.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
const pn=id=>S.patrols.find(p=>p.id===id)?.name||'بدون طليعة',nm=id=>S.people[id]||'—';
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4000)};
const q=async p=>{const{data,error}=await p;if(error)throw error;return data};
const bOf=k=>S.kb.filter(x=>x.kid_id===k.id).map(x=>x.badge_id);

async function load(){
 const since=fmt(add(new Date(),-120)),m=ym()+'-01';
 const R=await Promise.all([sb.from('kids').select('*'),sb.from('patrols').select('*'),sb.from('chants').select('*'),sb.from('badge_types').select('*'),sb.from('kid_badges').select('*'),sb.from('attendance').select('*').gte('day',since),sb.from('visits').select('*').gte('visited_at',m),sb.from('profiles').select('*')]);
 R.forEach(r=>{if(r.error)throw r.error});const[k,p,c,bt,kb,a,v,pr]=R.map(r=>r.data);
 Object.assign(S,{kids:k,patrols:p,chants:c,bt,kb,attRows:a});S.att={};a.forEach(r=>S.att[r.day+'_'+r.kid_id]=r.present);
 S.vis={};v.forEach(r=>S.vis[r.kid_id]=r);S.people={};pr.forEach(r=>S.people[r.id]=r.name||'خادم');
}

function loginV(){return H('خدمة الكشافة')+`<main><div class="c"><input data-f="em" type="email" placeholder="الإيميل" autocomplete="username"><input data-f="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">${B('دخول','login','ok w')}</div></main>`}

function attV(){const day=fmt(S.date),ks=kidsA(),p=ks.filter(k=>S.att[day+'_'+k.id]===true).length;
return H('حضور يوم الجمعة',arD(S.date))+`<main><div class="r" style="margin-bottom:10px">${B('الجمعة اللي قبلها','dd','','data-n="-7"')}${B('الجمعة اللي بعدها','dd','','data-n="7"')}</div>
<div class="c"><b>حاضر ${p} من ${ks.length}</b><small>الحفظ تلقائي عند الضغط</small></div>
${ks.map(k=>{const m=S.att[day+'_'+k.id];return `<div class="c r"><div class="f"><b>${esc(k.name)}</b><small>#${k.code} · ${esc(k.school_year||'—')} · ${esc(pn(k.patrol_id))}</small></div>${B('حاضر','mark',m===true?'ok':'',`data-k="${k.id}" data-v="1"`)}${B('غائب','mark',m===false?'no':'',`data-k="${k.id}" data-v="0"`)}</div>`}).join('')||em('مفيش أولاد لسه. ضيف أول ولد من صفحة الأولاد.')}</main>`}

function kidsV(){const s=S.q.trim(),ks=kidsA().filter(k=>!s||k.name.includes(s)||String(k.code).includes(s));
return H('الأولاد',kidsA().length+' ولد')+`<main>${B('+ إضافة ولد جديد','add','au w','style="margin-bottom:10px"')}<input id="q" data-f="q" placeholder="ابحث بالاسم أو الرقم التعريفي" value="${esc(S.q)}">
${ks.map(k=>`<div class="c r"><div class="f"><b>${esc(k.name)}</b><small>#${k.code} · ${esc(k.school_year||'—')}</small></div>${T(pn(k.patrol_id))}${B('فتح','open','',`data-k="${k.id}"`)}</div>`).join('')}
${admin?`<div class="c" style="margin-top:12px"><b>أنواع الشارات</b><div class="r" style="margin:8px 0">${S.bt.map(b=>T(b.name)).join('')}</div><input data-f="bn" placeholder="نوع شارة جديد" value="${esc(S.form.bn||'')}">${B('إضافة نوع شارة','addbadge','w')}</div>`:''}${admin?`<div class="c"><b>نسخة احتياطية (Excel)</b><small style="margin:4px 0 8px">ملف فيه الأولاد والحضور والطلايع والافتقاد والصيحات</small>${B('تنزيل نسخة Excel الآن','xl','au w')}<label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px"><input type="checkbox" data-a="autobk" ${auto()?'checked':''} style="width:auto;min-height:0;margin:0"> تنزيل نسخة تلقائياً بعد كل تغيير</label></div>`:''}</main>`}

function kidV(id){const k=S.kids.find(x=>x.id===id);if(!k)return H('الولد')+`<main>${em('جارٍ التحميل…')}${B('رجوع','back','w')}</main>`;
const days=[...new Set(S.attRows.filter(a=>a.day.startsWith(ym())).map(a=>a.day))].sort(),mine=d=>S.att[d+'_'+k.id],pr=days.filter(d=>mine(d)===true).length,r=days.length?pr/days.length:0,have=bOf(k);
const vd=!days.length?'لسه مفيش حضور الشهر ده':r>=.75?'ملتزم':r>=.5?'متوسط الالتزام':'محتاج افتقاد';
return H(esc(k.name),'الرقم التعريفي #'+k.code)+`<main><div class="c"><small>السن: ${k.age||'—'} · السنة الدراسية: ${esc(k.school_year||'—')}</small><small>العنوان: ${esc(k.address||'—')}</small><small>التليفون: ${esc(k.phone||'—')}</small><small>أب الاعتراف: ${esc(k.confession_father||'—')}</small><small>الطليعة: ${esc(pn(k.patrol_id))} · المسؤول: ${esc(S.patrols.find(p=>p.id===k.patrol_id)?.leader_name||'—')}</small><small>الخادم المسؤول عن افتقاده: ${esc(nm(k.servant_id))}</small></div>
<div class="c"><div class="r"><b class="f">الفولار</b>${T(k.has_scarf?'معاه':'مش معاه',k.has_scarf,'scarfq',`data-k="${k.id}"`)}</div><b style="display:block;margin-top:10px">الشارات (اضغط لتعليم الشارة)</b><div class="r" style="margin-top:8px">${S.bt.map(b=>T(b.name,have.includes(b.id),'badge',`data-k="${k.id}" data-b="${b.id}"`)).join('')}</div></div>
<div class="c"><div class="r"><b class="f">حضور الشهر ده</b><b style="color:var(--g)">${pr} من ${days.length} جمعات</b></div><div class="r" style="margin-top:8px;gap:6px">${days.map(d=>`<i class="sq ${mine(d)===true?'':'n'}"></i>`).join('')}</div><small>${vd}</small></div>
<div class="r">${k.phone?`<a class="b ok f" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="tel:${esc(k.phone)}">اتصال</a>`:''}${B('تعديل','edit','au f',`data-k="${k.id}"`)}</div>
<div class="r" style="margin-top:10px">${B('رجوع','back','f')}${admin?B('مسح الولد','delkid','no f',`data-k="${k.id}"`):''}</div></main>`}

function formV(){const f=S.form,chip=(fl,v,l)=>T(l,f[fl]===v,'pick',`data-f="${fl}" data-v="${v}"`),inp=(k,p,t='')=>`<input data-f="${k}" placeholder="${p}" value="${esc(f[k]||'')}" ${t}>`;
return H(f.id?'تعديل بيانات الولد':'ولد جديد')+`<main>${inp('code','الرقم التعريفي (اكتبه بنفسك)')}${inp('name','الاسم')}${inp('age','السن','inputmode="numeric"')}${inp('yr','السنة الدراسية')}${inp('addr','العنوان')}${inp('phone','رقم التليفون','inputmode="tel"')}${inp('conf','اسم أب الاعتراف')}
<div class="r" style="margin-bottom:12px"><b class="f">معاه فولار؟</b>${T(f.scarf?'معاه':'مش معاه',f.scarf,'scarf')}</div>
<b>الشارات</b><div class="r" style="margin:8px 0 12px">${S.bt.map(b=>T(b.name,(f.badges||[]).includes(b.id),'fbadge',`data-b="${b.id}"`)).join('')||'<small>ضيف أنواع الشارات الأول من صفحة الأولاد</small>'}</div>
<b>الطليعة</b><div class="r" style="margin:8px 0 12px">${S.patrols.map(p=>chip('patrol',p.id,p.name)).join('')||'<small>ضيف طلايع الأول من صفحة الطلايع</small>'}</div>
<b>الخادم المسؤول عن افتقاده</b><div class="r" style="margin:8px 0 12px">${Object.entries(S.people).map(([i,n])=>chip('servant',i,n)).join('')}</div>
<div class="r">${B('حفظ','save','ok f')}${B('إلغاء','cancel','f')}</div></main>`}

function patV(){const form=admin?`<div class="c"><b>إضافة طليعة</b><div style="height:8px"></div><input data-f="pn" placeholder="اسم الطليعة" value="${esc(S.form.pn||'')}"><input data-f="pl" placeholder="اسم المسؤول عنها" value="${esc(S.form.pl||'')}">${B('+ إضافة طليعة','addpat','au w')}</div>`:'<small style="margin-bottom:10px">إضافة ومسح الطلايع للأدمن بس</small>';
return H('الطلايع','كل ولد مسجل في طليعة ولها مسؤول')+`<main>${form}${S.patrols.map(p=>`<div class="c r"><div class="f"><b>طليعة ${esc(p.name)}</b><small>المسؤول: ${esc(p.leader_name||'—')}</small></div>${T(kidsA().filter(k=>k.patrol_id===p.id).length+' أولاد')}${admin?B('مسح','delpat','no',`data-p="${p.id}"`):''}</div>`).join('')||em('مفيش طلايع لسه.')}</main>`}

function visV(){const v=k=>S.vis[k.id],ks=kidsA();
if(!admin){const my=ks.filter(k=>k.servant_id===me.id);return H('افتقاد أولادي','للخادم · الشهر الحالي')+`<main><div class="c"><b>افتقدت ${my.filter(v).length} من ${my.length} أولاد</b><small>متابعتك دي ظاهرة للأدمن</small></div>${my.map(k=>`<div class="c r"><div class="f"><b>${esc(k.name)}</b><small>#${k.code}${k.phone?' · '+esc(k.phone):''}</small></div>${v(k)?T('تم الافتقاد',1,'unvisit',`data-v="${v(k).id}"`):B('تم الافتقاد','visit','au',`data-k="${k.id}"`)}</div>`).join('')||em('مفيش أولاد متسجلين عليك لسه.')}</main>`}
const gs=[...Object.entries(S.people).map(([id,n])=>({id,n})),{id:'',n:'بدون خادم'}].map(g=>({...g,ks:ks.filter(k=>(k.servant_id||'')===g.id)})).filter(g=>g.ks.length),dn=ks.filter(v).length;
return H('متابعة الافتقاد','للأدمن · الشهر الحالي')+`<main><div class="c"><b>تم افتقاد ${dn} من ${ks.length}</b><small>${ks.length-dn} أولاد لسه محدش افتقدهم</small></div>${gs.map(g=>{const d=g.ks.filter(v),l=g.ks.filter(k=>!v(k));return `<div class="c"><div class="r"><div class="f"><b>${esc(g.n)}</b><small>افتقد ${d.length} من ${g.ks.length}</small></div>${T(l.length?l.length+' باقي':'تم',!l.length)}</div>${d.length?`<small style="margin-top:8px">افتقدهم: ${d.map(k=>esc(k.name)+' ('+esc(nm(v(k).servant_id))+')').join('، ')}</small>`:''}${l.length?`<small style="margin-top:6px;color:var(--rd)">لم يُفتقدوا: ${l.map(k=>esc(k.name)).join('، ')}</small>`:''}</div>`}).join('')}</main>`}

function chV(){return H('الصيحات الكشفية')+`<main>${admin?B('+ إضافة صيحة جديدة','chnew','au w','style="margin-bottom:10px"'):'<small style="margin-bottom:10px">إضافة ومسح الصيحات للأدمن بس</small>'}${S.chants.map(c=>`<div class="c"><div class="r"><b class="f">${esc(c.title)}</b>${admin?B('تعديل','chedit','',`data-c="${c.id}"`)+B('مسح','chdelq','no',`data-c="${c.id}"`):''}</div><small style="white-space:pre-wrap">${esc(c.body)}</small></div>`).join('')||em('مفيش صيحات لسه.')}</main>`}
function chF(){const f=S.form;return H(f.id?'تعديل الصيحة':'صيحة جديدة')+`<main><input data-f="t" placeholder="اسم الصيحة" value="${esc(f.t||'')}"><textarea data-f="b" rows="8" placeholder="نص الصيحة">${esc(f.b||'')}</textarea><div class="r">${B('حفظ','chsave','ok f')}${B('إلغاء','cancel','f')}</div>${f.id?B('حذف الصيحة','chdel','no w','style="margin-top:10px"'):''}</main>`}

function render(){const v=S.view;
if(!ready){$('#app').innerHTML=me===null&&S.loaded?loginV():$('#app').innerHTML;$('#nav').innerHTML='';return}
$('#app').innerHTML=v?.t==='kid'?kidV(v.id):v?.t==='form'?formV():v?.t==='chant'?chF():{att:attV,kids:kidsV,pat:patV,vis:visV,ch:chV}[S.tab]();
$('#nav').innerHTML=TABS.map(([k,l])=>`<div class="${S.tab===k?'on':''}" data-a="tab" data-t="${k}"><i></i>${l}</div>`).join('');
if(S.tab==='kids'&&!v&&S.q&&document.activeElement===document.body){const i=$('#q');i.focus();i.setSelectionRange(i.value.length,i.value.length)}}

const auto=()=>{try{return localStorage.getItem('ab')==='1'}catch(e){return false}};
function touch(){S.dirty=true;if(admin&&auto()){clearTimeout(touch.t);touch.t=setTimeout(()=>exportXlsx(true).catch(()=>{}),15000)}}
async function exportXlsx(isAuto){
 if(!window.XLSX)throw{message:'مكتبة Excel لسه ما اتحمّلتش، جرّب تاني بعد ثواني'};
 const[a,v]=await Promise.all([sb.from('attendance').select('*'),sb.from('visits').select('*')]);if(a.error||v.error)throw a.error||v.error;
 const kn=Object.fromEntries(S.kids.map(k=>[k.id,k])),bn=Object.fromEntries(S.bt.map(b=>[b.id,b.name])),wb=XLSX.utils.book_new();
 const sheets=[['الأولاد',S.kids.map(k=>({'الرقم التعريفي':k.code,'الاسم':k.name,'السن':k.age,'السنة الدراسية':k.school_year,'العنوان':k.address,'التليفون':k.phone,'أب الاعتراف':k.confession_father,'الفولار':k.has_scarf?'معاه':'مش معاه','الشارات':bOf(k).map(i=>bn[i]).join('، '),'الطليعة':S.patrols.find(p=>p.id===k.patrol_id)?.name,'الخادم المسؤول':nm(k.servant_id),'الحالة':k.active===false?'موقوف':'نشط'}))],
 ['الحضور',a.data.sort((x,y)=>x.day<y.day?1:-1).map(r=>({'التاريخ':r.day,'الرقم التعريفي':kn[r.kid_id]?.code,'الاسم':kn[r.kid_id]?.name,'الحالة':r.present?'حاضر':'غائب'}))],
 ['الطلايع',S.patrols.map(p=>({'الطليعة':p.name,'المسؤول':p.leader_name,'عدد الأولاد':S.kids.filter(k=>k.patrol_id===p.id&&k.active!==false).length}))],
 ['الافتقاد',v.data.map(r=>({'التاريخ':String(r.visited_at).slice(0,10),'الولد':kn[r.kid_id]?.name,'الخادم':nm(r.servant_id)}))],
 ['الصيحات',S.chants.map(c=>({'الصيحة':c.title,'النص':c.body}))]];
 sheets.forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.length?r:[{'—':''}]),n));
 wb.Workbook={Views:[{RTL:true}]};XLSX.writeFile(wb,'kashafa-backup-'+fmt(new Date())+'.xlsx');S.dirty=false;if(!isAuto)toast('تم تنزيل النسخة');render()}
const W=f=>async d=>{await f(d);await load();touch()};
const A={xl:()=>exportXlsx(false),autobk:()=>{try{localStorage.setItem('ab',auto()?'0':'1')}catch(e){}},tab:d=>{S.tab=d.t;S.view=null;S.form={}},dd:d=>{S.date=add(S.date,+d.n)},open:d=>{S.view={t:'kid',id:d.k}},back:()=>{S.view=null},
cancel:()=>{S.view=S.form.id&&S.form.name!==undefined?{t:'kid',id:S.form.id}:null;S.form={}},add:()=>{S.form={};S.view={t:'form'}},
edit:d=>{const k=S.kids.find(x=>x.id===d.k);S.form={id:k.id,code:k.code||'',name:k.name,age:k.age||'',yr:k.school_year||'',addr:k.address||'',phone:k.phone||'',conf:k.confession_father||'',scarf:!!k.has_scarf,patrol:k.patrol_id||'',servant:k.servant_id||'',badges:bOf(k)};S.view={t:'form'}},
pick:d=>{S.form[d.f]=S.form[d.f]===d.v?'':d.v},scarf:()=>{S.form.scarf=!S.form.scarf},fbadge:d=>{const a=S.form.badges||[];S.form.badges=a.includes(d.b)?a.filter(x=>x!==d.b):[...a,d.b]},
chnew:()=>{S.form={};S.view={t:'chant'}},chedit:d=>{const c=S.chants.find(x=>x.id===d.c);S.form={id:c.id,t:c.title,b:c.body};S.view={t:'chant'}},
async login(){const{error}=await sb.auth.signInWithPassword({email:(S.form.em||'').trim(),password:S.form.pw||''});if(error)return toast('الإيميل أو كلمة السر غلط');S.form={};await boot()},
async out(){await sb.auth.signOut();me=null;ready=false;S.loaded=true;S.view=null},
mark:W(d=>q(sb.from('attendance').upsert({kid_id:d.k,day:fmt(S.date),present:d.v==='1'},{onConflict:'kid_id,day'}))),
save:W(async()=>{const f=S.form;if(!f.name?.trim())throw{message:'اكتب اسم الولد'};const code=(f.code||'').trim();if(!code)throw{message:'اكتب الرقم التعريفي'};if(S.kids.some(k=>String(k.code)===code&&k.id!==f.id))throw{message:'الرقم التعريفي ده مستخدم لولد تاني'};const row={code,name:f.name.trim(),age:+f.age||null,school_year:f.yr||null,address:f.addr||null,phone:f.phone||null,confession_father:f.conf||null,has_scarf:!!f.scarf,patrol_id:f.patrol||null,servant_id:f.servant||null};
 const r=await q(f.id?sb.from('kids').update(row).eq('id',f.id).select('id').single():sb.from('kids').insert(row).select('id').single());const want=f.badges||[],old=f.id?bOf({id:f.id}):[],rm=old.filter(x=>!want.includes(x)),ad=want.filter(x=>!old.includes(x));if(rm.length)await q(sb.from('kid_badges').delete().eq('kid_id',r.id).in('badge_id',rm));if(ad.length)await q(sb.from('kid_badges').insert(ad.map(b=>({kid_id:r.id,badge_id:b}))));S.form={};S.view={t:'kid',id:r.id}}),
badge:W(d=>q(bOf({id:d.k}).includes(d.b)?sb.from('kid_badges').delete().eq('kid_id',d.k).eq('badge_id',d.b):sb.from('kid_badges').insert({kid_id:d.k,badge_id:d.b}))),
scarfq:W(d=>q(sb.from('kids').update({has_scarf:!S.kids.find(x=>x.id===d.k).has_scarf}).eq('id',d.k))),
delkid:W(async d=>{if(confirm('مسح الولد نهائياً مع كل حضوره وبياناته؟')){await q(sb.from('kids').delete().eq('id',d.k));S.view=null}}),
visit:W(d=>q(sb.from('visits').insert({kid_id:d.k,servant_id:me.id}))),unvisit:W(d=>q(sb.from('visits').delete().eq('id',d.v))),
addpat:W(async()=>{const f=S.form;if(!f.pn?.trim())throw{message:'اكتب اسم الطليعة'};await q(sb.from('patrols').insert({name:f.pn.trim(),leader_name:(f.pl||'').trim()}));S.form={}}),
delpat:W(async d=>{if(confirm('حذف الطليعة؟'))await q(sb.from('patrols').delete().eq('id',d.p))}),
addbadge:W(async()=>{const n=(S.form.bn||'').trim();if(n){await q(sb.from('badge_types').insert({name:n}));S.form={}}}),
chsave:W(async()=>{const f=S.form;if(!f.t?.trim())throw{message:'اكتب اسم الصيحة'};const row={title:f.t.trim(),body:f.b||''};await q(f.id?sb.from('chants').update(row).eq('id',f.id):sb.from('chants').insert(row));S.form={};S.view=null}),
chdelq:W(async d=>{if(confirm('مسح الصيحة؟'))await q(sb.from('chants').delete().eq('id',d.c))}),chdel:W(async()=>{if(confirm('حذف الصيحة؟')){await q(sb.from('chants').delete().eq('id',S.form.id));S.form={};S.view=null}})};

document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el||!A[el.dataset.a])return;
try{await A[el.dataset.a]({...el.dataset})}catch(x){toast(x.message||'حصل خطأ')}render()});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;if(f==='q'){S.q=e.target.value;render()}else S.form[f]=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.f==='pw')A.login()});

async function boot(){try{const{data:{session}}=await sb.auth.getSession();S.loaded=true;if(!session){me=null;ready=false;return render()}
 const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();me={id:session.user.id,name:p?.name};admin=p?.role==='admin';await load();ready=true;render()}
 catch(x){S.loaded=true;$('#app').innerHTML=em('تعذر الاتصال بقاعدة البيانات. اتأكد من الرابط والمفتاح في أول الملف.')}}
boot();
</script></body></html>
