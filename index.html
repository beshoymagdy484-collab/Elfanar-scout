const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
sb.auth.onAuthStateChange(e=>{if(e==='PASSWORD_RECOVERY'){S.recovery=true;if(ready){S.view={t:'acct'};render()}}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._ip=e});
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const lastFri=(d=new Date())=>add(d,-((d.getDay()+2)%7));
const arD=d=>d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS=[['att','الحضور'],['kids','الأولاد'],['pat','الطلايع'],['vis','الافتقاد'],['ch','الصيحات']];
const S={tab:'att',view:null,form:{},q:'',date:lastFri(),kids:[],patrols:[],chants:[],bt:[],kb:[],att:{},attRows:[],vis:{},people:{},prof:[],pts:[],vh:[]};
let me=null,admin=false,ready=false;
const ym=()=>fmt(new Date()).slice(0,7);
// دورة الافتقاد: من الجمعة 12 ص لحد الأربع 9 م، وبعدها مقفولة لحد الجمعة الجاية
const cycleStart=()=>{const d=lastFri();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const deadline=()=>{const c=cycleStart();return new Date(c.getFullYear(),c.getMonth(),c.getDate()+5,21,0)};
const closed=()=>new Date()>=deadline();
const stat=()=>closed()?'مقفول · انتهى ميعاد الافتقاد (الأربع ٩ مساءً)':'مفتوح لحد الأربع ٩ مساءً';
const sd=x=>new Date(x).toLocaleDateString('ar-EG',{day:'numeric',month:'short'});
const av=k=>k.photo?`<img class="av" src="${k.photo}" alt="">`:`<div class="av">${esc((k.name||'؟')[0])}</div>`;
// عدد الجمعات المتتالية اللي الولد غايبها (آخر الجمعات المسجلة له)
const streak=k=>{let n=0;for(const d of [...new Set(S.attRows.map(r=>r.day))].sort().reverse()){const p=S.att[d+'_'+k.id];if(p===true)break;if(p===false)n++}return n};
const mineKids=()=>kidsA().filter(k=>k.servant_id===me.id||(admin&&!k.servant_id));
const warn=()=>{if(!ready||closed())return'';const ms=deadline()-new Date();if(ms>864e5)return'';const my=mineKids().filter(k=>!S.vis[k.id]);if(!my.length)return'';return `<div class="c" style="margin:10px 16px 0;border-color:var(--rd)"><b style="color:var(--rd)">فاضل حوالي ${Math.max(1,Math.ceil(ms/36e5))} ساعة على قفل الافتقاد</b><small>لسه عندك ${my.length} أولاد ماتفتقدوش</small></div>`};
const B=(l,a,k='',x='')=>`<button class="b ${k}" data-a="${a}" ${x}>${l}</button>`;
const T=(l,on,a,x='')=>`<span class="t${on?' on':''}"${a?` data-a="${a}" ${x}`:''}>${esc(l)}</span>`;
const H=(t,s)=>`<header><img class="lg" src="${LOGO}" alt=""><div><h1>${t}</h1>${s?`<p>${s}</p>`:''}</div>${me?'<button class="lo" data-a="acct">حسابي</button><button class="lo" data-a="out">خروج</button>':''}</header>${S.dirty&&admin&&ready?`<div class="c r" style="margin:10px 16px 0"><div class="f"><b>اتغيرت بيانات</b><small>نزّل نسخة Excel محدّثة</small></div>${B('تنزيل','xl','au')}</div>`:''}${warn()}`;
const em=t=>`<div class="e">${t}</div>`;
const kidsA=()=>S.kids.filter(k=>k.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
const pn=id=>S.patrols.find(p=>p.id===id)?.name||'بدون طليعة',nm=id=>S.people[id]||'—';
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4000)};
const q=async p=>{const{data,error}=await p;if(error)throw error;return data};
const bOf=k=>S.kb.filter(x=>x.kid_id===k.id).map(x=>x.badge_id);

async function load(){
 const since=fmt(add(new Date(),-120)),vs=add(new Date(),-180).toISOString();
 const R=await Promise.all([sb.from('kids').select('*'),sb.from('patrols').select('*'),sb.from('chants').select('*'),sb.from('badge_types').select('*'),sb.from('kid_badges').select('*'),sb.from('attendance').select('*').gte('day',since),sb.from('visits').select('*').gte('visited_at',vs),sb.from('profiles').select('*'),sb.from('points').select('*')]);
 R.slice(0,8).forEach(r=>{if(r.error)throw r.error});const[k,p,c,bt,kb,a,v,pr,pt]=R.map(r=>r.data);
 Object.assign(S,{kids:k,patrols:p,chants:c,bt,kb,attRows:a,prof:pr,pts:pt||[],vh:v});S.att={};a.forEach(r=>S.att[r.day+'_'+r.kid_id]=r.present);
 S.vis={};v.filter(r=>new Date(r.visited_at)>=cycleStart()).forEach(r=>S.vis[r.kid_id]=r);S.people={};pr.forEach(r=>S.people[r.id]=r.name||'خادم');
}

function loginV(){return H('خدمة الكشافة')+`<main><img src="${LOGO}" alt="" style="width:150px;height:150px;border-radius:50%;display:block;margin:6px auto 14px"><div class="c"><input data-f="em" type="email" placeholder="الإيميل" autocomplete="username"><input data-f="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">${B('دخول','login','ok w')}<div style="height:8px"></div>${B('نسيت كلمة السر؟','forgot','w')}</div></main>`}

function attV(){const day=fmt(S.date),ks=kidsA(),p=ks.filter(k=>S.att[day+'_'+k.id]===true).length;
return H('حضور يوم الجمعة',arD(S.date))+`<main><div class="r" style="margin-bottom:10px">${B('الجمعة اللي قبلها','dd','','data-n="-7"')}${B('الجمعة اللي بعدها','dd','','data-n="7"')}</div>
<div class="c"><b>حاضر ${p} من ${ks.length}</b><small>الحفظ تلقائي عند الضغط</small></div>
${ks.map(k=>{const m=S.att[day+'_'+k.id];return `<div class="c r">${av(k)}<div class="f"><b>${esc(k.name)}</b><small>#${k.code} · ${esc(k.school_year||'—')} · ${esc(pn(k.patrol_id))}</small></div>${B('حاضر','mark',m===true?'ok':'',`data-k="${k.id}" data-v="1"`)}${B('غائب','mark',m===false?'no':'',`data-k="${k.id}" data-v="0"`)}</div>`}).join('')||em('مفيش أولاد لسه. ضيف أول ولد من صفحة الأولاد.')}</main>`}

function kidsV(){const s=S.q.trim(),ks=kidsA().filter(k=>!s||k.name.includes(s)||String(k.code).includes(s));
return H('الأولاد',kidsA().length+' ولد')+`<main>${B('+ إضافة ولد جديد','add','au w','style="margin-bottom:10px"')}<input id="q" data-f="q" placeholder="ابحث بالاسم أو الرقم التعريفي" value="${esc(S.q)}">
${ks.map(k=>`<div class="c r">${av(k)}<div class="f"><b>${esc(k.name)}</b><small>#${k.code} · ${esc(k.school_year||'—')}</small></div>${T(pn(k.patrol_id))}${B('فتح','open','',`data-k="${k.id}"`)}</div>`).join('')}
${admin?`<div class="c" style="margin-top:12px"><b>أنواع الشارات</b><div class="r" style="margin:8px 0">${S.bt.map(b=>T(b.name)).join('')}</div><input data-f="bn" placeholder="نوع شارة جديد" value="${esc(S.form.bn||'')}">${B('إضافة نوع شارة','addbadge','w')}</div>`:''}${admin?`<div class="c"><b>نسخة احتياطية (Excel)</b><small style="margin:4px 0 8px">ملف فيه الأولاد والحضور والطلايع والافتقاد والصيحات</small>${B('تنزيل نسخة Excel الآن','xl','au w')}<label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px"><input type="checkbox" data-a="autobk" ${auto()?'checked':''} style="width:auto;min-height:0;margin:0"> تنزيل نسخة تلقائياً بعد كل تغيير</label></div>`:''}${admin?`<div class="c">${B('إدارة الخدام','staff','w')}</div>`:''}<small style="text-align:center;margin-top:16px">الإصدار ٣ · الرقم التعريفي يدوي</small></main>`}

function kidV(id){const k=S.kids.find(x=>x.id===id);if(!k)return H('الولد')+`<main>${em('جارٍ التحميل…')}${B('رجوع','back','w')}</main>`;

mark:W(d=>q(sb.from('attendance').upsert({kid_id:d.k,day:fmt(S.date),present:d.v==='1'},{onConflict:'kid_id,day'}))),
save:W(async()=>{const f=S.form;if(!f.name?.trim())throw{message:'اكتب اسم الولد'};const code=(f.code||'').trim();if(!code)throw{message:'اكتب الرقم التعريفي'};if(S.kids.some(k=>String(k.code)===code&&k.id!==f.id))throw{message:'الرقم التعريفي ده مستخدم لولد تاني'};const row={code,name:f.name.trim(),age:+f.age||null,school_year:f.yr||null,address:f.addr||null,phone:f.phone||null,confession_father:f.conf||null,photo:f.photo||null,has_scarf:!!f.scarf,patrol_id:f.patrol||null,servant_id:f.servant||null};
 const r=await q(f.id?sb.from('kids').update(row).eq('id',f.id).select('id').single():sb.from('kids').insert(row).select('id').single());const want=f.badges||[],old=f.id?bOf({id:f.id}):[],rm=old.filter(x=>!want.includes(x)),ad=want.filter(x=>!old.includes(x));if(rm.length)await q(sb.from('kid_badges').delete().eq('kid_id',r.id).in('badge_id',rm));if(ad.length)await q(sb.from('kid_badges').insert(ad.map(b=>({kid_id:r.id,badge_id:b}))));S.form={};S.view={t:'kid',id:r.id}}),
badge:W(d=>q(bOf({id:d.k}).includes(d.b)?sb.from('kid_badges').delete().eq('kid_id',d.k).eq('badge_id',d.b):sb.from('kid_badges').insert({kid_id:d.k,badge_id:d.b}))),
scarfq:W(d=>q(sb.from('kids').update({has_scarf:!S.kids.find(x=>x.id===d.k).has_scarf}).eq('id',d.k))),
delkid:W(async d=>{if(confirm('مسح الولد نهائياً مع كل حضوره وبياناته؟')){await q(sb.from('kids').delete().eq('id',d.k));S.view=null}}),
visit:W(async d=>{if(closed())throw{message:'انتهى ميعاد الافتقاد (الأربع ٩ مساءً)'};const note=prompt('ملاحظة عن الافتقاد (اختياري)، مثلاً: مريض، مسافر، محتاج زيارة');if(note===null)return;try{await q(sb.from('visits').insert({kid_id:d.k,servant_id:me.id,note:note.trim()||null}))}catch(e){throw{message:'انتهى ميعاد الافتقاد أو حصل خطأ'}}}),
unvisit:W(async d=>{if(closed())throw{message:'انتهى ميعاد الافتقاد (الأربع ٩ مساءً)'};await q(sb.from('visits').delete().eq('id',d.v))}),
addpat:W(async()=>{const f=S.form;if(!f.pn?.trim())throw{message:'اكتب اسم الطليعة'};await q(sb.from('patrols').insert({name:f.pn.trim(),leader_name:(f.pl||'').trim()}));S.form={}}),
delpat:W(async d=>{if(confirm('حذف الطليعة؟'))await q(sb.from('patrols').delete().eq('id',d.p))}),
addbadge:W(async()=>{const n=(S.form.bn||'').trim();if(n){await q(sb.from('badge_types').insert({name:n}));S.form={}}}),
chsave:W(async()=>{const f=S.form;if(!f.t?.trim())throw{message:'اكتب اسم الصيحة'};const row={title:f.t.trim(),body:f.b||''};await q(f.id?sb.from('chants').update(row).eq('id',f.id):sb.from('chants').insert(row));S.form={};S.view=null}),
chdelq:W(async d=>{if(confirm('مسح الصيحة؟'))await q(sb.from('chants').delete().eq('id',d.c))}),chdel:W(async()=>{if(confirm('حذف الصيحة؟')){await q(sb.from('chants').delete().eq('id',S.form.id));S.form={};S.view=null}})};

document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el||!A[el.dataset.a])return;
try{await A[el.dataset.a]({...el.dataset})}catch(x){toast(x.message||'حصل خطأ')}render()});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;if(f==='q'){S.q=e.target.value;render()}else S.form[f]=e.target.value});
document.addEventListener('change',e=>{if(e.target.id!=='ph'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),z=160,m=Math.min(i.width,i.height);c.width=c.height=z;c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,z,z);S.form.photo=c.toDataURL('image/jpeg',.7);render()};i.src=r.result};r.readAsDataURL(e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.f==='pw')A.login()});

async function boot(){try{const{data:{session}}=await sb.auth.getSession();S.loaded=true;if(!session){me=null;ready=false;return render()}
 const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();me={id:session.user.id,name:p?.name};admin=p?.role==='admin';await load();ready=true;if(S.recovery){S.view={t:'acct'};toast('اكتب كلمة سر جديدة')}render()}
 catch(x){S.loaded=true;$('#app').innerHTML=em('تعذر الاتصال بقاعدة البيانات. اتأكد من الرابط والمفتاح في أول الملف.')}}
boot();
</script></body></html>
